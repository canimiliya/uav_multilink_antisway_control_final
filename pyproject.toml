[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-multilink-antisway-control"
version = "1.0.0"
description = "Reproducible MuJoCo benchmark for UAV multi-link anti-sway control"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy==2.4.6",
    "mujoco==3.0.1",
    "pyyaml==6.0.3",
    "matplotlib==3.11.1",
    "imageio==2.37.4",
    "scipy==1.17.1",
    "osqp==1.1.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
