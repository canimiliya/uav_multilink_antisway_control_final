constant_crosswind:
  type: constant
  duration_s: 12.0
  start_time_s: 4.0
  speed_x_m_s: 3.0

one_cosine_gust:
  type: one_cosine
  duration_s: 12.0
  start_time_s: 5.0
  gust_duration_s: 2.0
  peak_speed_x_m_s: 3.0

low_frequency_random:
  type: low_pass_gaussian
  duration_s: 12.0
  dt_s: 0.005
  mean_x_m_s: 0.0
  sigma_x_m_s: 0.8
  time_constant_s: 1.0
  clip_abs_x_m_s: 3.0
  initial_value_x_m_s: 0.0
  rng: numpy.PCG64
